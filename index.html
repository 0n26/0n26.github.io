<!doctype html>
<html lang="ru" data-mantine-color-scheme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      try {
        const scheme = localStorage.getItem('mantine-color-scheme-value');
        if (scheme === 'light' || (scheme === 'auto' && matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.dataset.mantineColorScheme = 'light';
        }
      } catch {}
    </script>
    <meta name="theme-color" content="#14141a" />
    <meta name="description" content="Каталог аниме и HLS-плеер с Anime4K." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <title>Ночной сеанс — аниме-каталог</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Для каталога и плеера нужен JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
