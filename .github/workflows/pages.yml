name: Publish to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.snapshot.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Publish merged versions
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs publish
      - name: Select the main commit to deploy
        id: snapshot
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  sync-changelog:
    needs: release
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    environment: release-bump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Copy the released changelog
        id: changelog
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          git show "refs/tags/$RELEASE_TAG:changelog.md" > changelog.md
          if ! git diff --quiet -- changelog.md; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: steps.changelog.outputs.changed == 'true'
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Update changelog PR and enable auto-merge
        if: steps.changelog.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          branch=automation/sync-changelog
          ref=refs/heads/$branch
          previous=$(git ls-remote origin "$ref" | cut -f1)
          if [[ -z "$previous" ]] || ! git diff --quiet "$previous" -- changelog.md ||
            [[ "$(git rev-parse "$previous^")" != "$(git rev-parse HEAD)" ]]; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs(changelog): синхронизировать историю релизов' -- changelog.md
            git -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
              push --force-with-lease="$ref:$previous" origin "HEAD:$ref"
          fi
          pr=$(gh pr list -R "$GITHUB_REPOSITORY" --base main --head "$branch" \
            --json number --jq '.[0].number // empty')
          if [[ -z "$pr" ]]; then
            pr=$(gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title 'docs(changelog): синхронизировать историю релизов' \
              --body "Копия changelog.md из тега $RELEASE_TAG. Без повышения версии.")
          fi
          state=$(gh pr view "$pr" -R "$GITHUB_REPOSITORY" --json id,autoMergeRequest,state)
          if jq -e '.state == "OPEN" and .autoMergeRequest == null' <<< "$state" >/dev/null; then
            # GraphQL expands $id from the request variables, not from Bash.
            # shellcheck disable=SC2016
            gh api graphql -f id="$(jq -r .id <<< "$state")" \
              -f query='mutation($id: ID!) { enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH}) { pullRequest { number } } }'
          fi
  catalog:
    if: github.ref == 'refs/heads/main' && github.event_name != 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Collect the complete catalog
        run: node scripts/catalog-index.mjs "$RUNNER_TEMP/catalog-index.json"
      - name: Save the catalog snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch=automation/catalog-data
          data="$RUNNER_TEMP/catalog-data"
          if git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
            git worktree add --detach "$data" "refs/remotes/origin/$branch"
          else
            git init "$data"
          fi
          cp "$RUNNER_TEMP/catalog-index.json" "$data/catalog-index.json"
          git -C "$data" add -- catalog-index.json
          git -C "$data" -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'chore(catalog): обновить индекс'
          git -C "$data" -c credential.helper= -c 'credential.helper=!gh auth git-credential' \
            push "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git" "HEAD:refs/heads/$branch"
  build:
    needs: [release, catalog]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.release.outputs.sha || 'main' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Apply version and changelog from the release tag
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule ]]; then
            RELEASE_TAG=$(gh release view --json tagName --jq '.tagName')
          fi
          node scripts/release.mjs materialize "$RELEASE_TAG"
      - run: npm ci
      - name: Build the site
        run: npm run build
      - name: Copy the latest complete catalog
        run: |
          ref=refs/remotes/origin/automation/catalog-data
          if git show-ref --verify --quiet "$ref"; then
            git show "$ref:catalog-index.json" > dist/catalog-index.json
          fi
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
  deploy:
    needs: build
    # Optional release or catalog jobs can be skipped even when build succeeds.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
