name: Bump version in pull request
on:
  workflow_run:
    workflows: [Pull request CI]
    types: [completed]
permissions:
  actions: read
  contents: read
  pull-requests: read
jobs:
  bump:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.id == github.event.repository.id
    runs-on: ubuntu-latest
    environment: release-bump
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
      - name: Prepare version for current PR head
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs prepare
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        if: steps.prepare.outputs.pending == 'true'
        id: app
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Commit release files to the same PR
        if: steps.prepare.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh api graphql --input "$RUNNER_TEMP/version-commit.json" --jq '.data.createCommitOnBranch.commit.oid'
